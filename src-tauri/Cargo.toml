[package]
name = "repo-deployer"
version = "0.1.0"
description = "A desktop tool for linking folders to git repositories and deploying them."
authors = ["Codex"]
edition = "2021"

[lib]
name = "repo_deployer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

